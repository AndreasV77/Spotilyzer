[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spotilyzer"
version = "2.0.0"
description = "Hit/Mid/Flop audio analyzer — evaluates mainstream compatibility of audio tracks"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Andreas Vogelsang"},
]

dependencies = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "transformers>=4.30.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "numpy>=1.24.0",
    "soundfile>=0.12.0",
    "pyloudnorm>=0.1.0",
    "librosa>=0.10.0",
    "PySide6>=6.7.0",
]

[project.optional-dependencies]
training = [
    "pandas>=2.0.0",
    "requests>=2.28.0",
    "tqdm>=4.65.0",
]
dev = [
    "pyinstaller>=6.0.0",
    "pytest>=7.0.0",
]

[project.scripts]
spotilyzer = "spotilyzer.gui.app:run_app"
spotilyzer-cli = "spotilyzer.cli.analyze:main"

[project.gui-scripts]
spotilyzer-gui = "spotilyzer.gui.app:run_app"

[tool.setuptools.packages.find]
include = ["spotilyzer*"]
exclude = ["training*", "legacy*", "tests*"]
